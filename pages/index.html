<script>
    hashes = window.location.hash.substr(1).split("&");
    oauth2_access_token = "Failed";
    for (index in hashes){
        keyValue = hashes[index].split("=");
        if (keyValue[0] == "access_token") {
            oauth2_access_token = keyValue[1];
            break;
        }
    }
    document.getElementById("oauth2_access_token").value = oauth2_access_token;

    function copyToClipboard() {
        /* Get the text field */
        var copyText = document.getElementById("oauth2_access_token");

        /* Select the text field */
        copyText.select();
        copyText.setSelectionRange(0, 99999); /*For mobile devices*/

        /* Copy the text inside the text field */
        document.execCommand("copy");
    }


</script>
